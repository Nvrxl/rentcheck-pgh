<!-- Traffic (animated) -->
<style>
  /* Vehicles loop across the deck. Page CSS swaps to the still bridge.svg for reduced motion or "Pause". */
  .v { animation: east 22s linear infinite; }
  .w { animation: west 19s linear infinite; }
  @keyframes east { from { transform: translate(-90px, 299px); } to { transform: translate(1290px, 299px); } }
  @keyframes west { from { transform: translate(1290px, 299px) scale(-.85, .85); } to { transform: translate(-90px, 299px) scale(-.85, .85); } }
  @media (prefers-reduced-motion: reduce) { .v, .w { animation: none; display: none; } }
</style>
